<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">Pet microchip record mismatch check</title><desc id="desc">Warm editorial illustration of a dog beside a microchip scanner and two veterinary travel documents whose microchip numbers are being compared.</desc><rect width="1400" height="840" fill="#EAF4EE"/><circle cx="1130" cy="145" r="92" fill="#C9A84C" opacity=".22"/><path d="M0 680 Q330 590 700 685 T1400 650 V840 H0Z" fill="#9DC4AA" opacity=".55"/><rect x="620" y="150" width="570" height="500" rx="28" fill="#FAFCFB" stroke="#7C9E87" stroke-width="4"/><rect x="665" y="205" width="480" height="64" rx="12" fill="#2C4A38"/><text x="705" y="247" font-family="Georgia,serif" font-size="30" fill="#FAFCFB">TRAVEL RECORD CHECK</text><text x="675" y="330" font-family="Arial,sans-serif" font-size="23" fill="#1A2E22">Microchip scan</text><rect x="675" y="350" width="440" height="58" rx="10" fill="#EAF4EE"/><text x="705" y="388" font-family="monospace" font-size="26" fill="#2C4A38">985 141 000 123 456</text><text x="675" y="462" font-family="Arial,sans-serif" font-size="23" fill="#1A2E22">Rabies certificate</text><rect x="675" y="482" width="440" height="58" rx="10" fill="#FFF5E5" stroke="#C9A84C" stroke-width="2"/><text x="705" y="520" font-family="monospace" font-size="26" fill="#1A2E22">985 141 000 123 4<tspan fill="#9B4A3F" font-weight="700">5</tspan>6</text><circle cx="1090" cy="511" r="19" fill="#C9A84C"/><text x="1081" y="520" font-family="Arial" font-size="24" font-weight="700" fill="#FAFCFB">!</text><rect x="675" y="580" width="310" height="8" rx="4" fill="#7C9E87" opacity=".5"/><rect x="675" y="605" width="220" height="8" rx="4" fill="#7C9E87" opacity=".35"/><g transform="translate(120 195)"><ellipse cx="220" cy="425" rx="175" ry="55" fill="#2C4A38" opacity=".12"/><path d="M120 225 Q105 115 165 85 Q235 45 305 90 Q360 125 350 230 L335 380 Q310 455 220 455 Q125 455 105 375Z" fill="#B98A5D"/><path d="M150 110 Q80 80 92 185 L135 220Z" fill="#8A5F3E"/><path d="M295 105 Q370 70 360 185 L325 220Z" fill="#8A5F3E"/><ellipse cx="180" cy="215" rx="12" ry="15" fill="#1A2E22"/><ellipse cx="280" cy="215" rx="12" ry="15" fill="#1A2E22"/><ellipse cx="230" cy="265" rx="23" ry="16" fill="#1A2E22"/><path d="M205 290 Q230 315 255 290" fill="none" stroke="#1A2E22" stroke-width="7" stroke-linecap="round"/><path d="M120 340 Q45 330 55 255" fill="none" stroke="#B98A5D" stroke-width="28" stroke-linecap="round"/></g><g transform="translate(430 115) rotate(12)"><rect x="0" y="0" width="120" height="245" rx="35" fill="#2C4A38"/><rect x="28" y="38" width="64" height="72" rx="10" fill="#9DC4AA"/><circle cx="60" cy="165" r="22" fill="#C9A84C"/><path d="M60 245 L60 315" stroke="#2C4A38" stroke-width="18" stroke-linecap="round"/></g><text x="120" y="750" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#2C4A38">SCAN THE CHIP. THEN CHECK EVERY RECORD.</text><text x="120" y="795" font-family="Arial,sans-serif" font-size="22" fill="#5C7464">A pre-travel document check can catch one wrong digit before it becomes a border problem.</text></svg>