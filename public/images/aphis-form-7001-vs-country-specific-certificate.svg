<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">APHIS Form 7001 versus destination-specific pet health certificate</title><desc id="desc">Editorial illustration of a dog beside two travel document folders, one labeled Form 7001 and one labeled Destination Certificate, with a passport and route line.</desc><rect width="1400" height="840" fill="#EAF4EE"/><circle cx="1170" cy="140" r="170" fill="#DCE8E0"/><circle cx="180" cy="720" r="220" fill="#F4E9C8"/><path d="M104 566 C320 488 462 534 638 458 S948 336 1280 382" fill="none" stroke="#C9A84C" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 20"/><circle cx="105" cy="566" r="13" fill="#2C4A38"/><circle cx="1280" cy="382" r="13" fill="#2C4A38"/><g transform="translate(180 180)"><rect x="0" y="48" width="430" height="330" rx="28" fill="#fff" stroke="#CFE0D4" stroke-width="5"/><rect x="0" y="48" width="430" height="82" rx="28" fill="#2C4A38"/><rect x="0" y="102" width="430" height="28" fill="#2C4A38"/><text x="38" y="98" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">APHIS FORM 7001</text><text x="38" y="182" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2C4A38">Sometimes useful.</text><text x="38" y="225" font-family="Arial, sans-serif" font-size="23" fill="#5C7464">Not the universal form</text><text x="38" y="258" font-family="Arial, sans-serif" font-size="23" fill="#5C7464">for international entry.</text><rect x="38" y="302" width="260" height="12" rx="6" fill="#DCE8E0"/><rect x="38" y="334" width="332" height="12" rx="6" fill="#DCE8E0"/></g><g transform="translate(750 118)"><rect x="0" y="48" width="470" height="382" rx="28" fill="#fff" stroke="#C9A84C" stroke-width="6"/><rect x="0" y="48" width="470" height="82" rx="28" fill="#2C4A38"/><rect x="0" y="102" width="470" height="28" fill="#2C4A38"/><text x="34" y="97" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#fff">DESTINATION CERTIFICATE</text><text x="38" y="182" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2C4A38">Usually the key document</text><text x="38" y="225" font-family="Arial, sans-serif" font-size="23" fill="#5C7464">when the destination has</text><text x="38" y="258" font-family="Arial, sans-serif" font-size="23" fill="#5C7464">a specific health certificate.</text><path d="M50 322 l20 20 42-48" fill="none" stroke="#2C4A38" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="309" width="278" height="12" rx="6" fill="#DCE8E0"/><rect x="130" y="343" width="220" height="12" rx="6" fill="#DCE8E0"/></g><g transform="translate(560 590)"><ellipse cx="118" cy="116" rx="122" ry="54" fill="#D2C5B0"/><circle cx="112" cy="48" r="72" fill="#B58C65"/><path d="M55 15 C20 24 17 83 53 100 C70 79 75 43 55 15Z" fill="#8B6749"/><path d="M168 15 C203 24 206 83 170 100 C153 79 148 43 168 15Z" fill="#8B6749"/><circle cx="87" cy="44" r="7" fill="#1A2E22"/><circle cx="137" cy="44" r="7" fill="#1A2E22"/><ellipse cx="112" cy="70" rx="13" ry="10" fill="#1A2E22"/><path d="M95 86 Q112 102 130 86" fill="none" stroke="#1A2E22" stroke-width="5" stroke-linecap="round"/><path d="M49 101 Q111 145 176 101 L190 184 L36 184Z" fill="#7C9E87"/></g><g transform="translate(1020 590) rotate(-8)"><rect width="190" height="132" rx="18" fill="#2C4A38"/><rect x="20" y="18" width="150" height="96" rx="10" fill="#FAFCFB"/><circle cx="54" cy="66" r="24" fill="#C9A84C"/><path d="M95 43 h54 M95 67 h45 M95 91 h50" stroke="#7C9E87" stroke-width="8" stroke-linecap="round"/></g></svg>