<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">Pet medication list for veterinary visits</title><desc id="desc">Editorial illustration of a dog and cat beside an organized medication list showing medicine name, dose, frequency, purpose, allergies and veterinarian contact details.</desc><rect width="1400" height="840" fill="#EAF4EE"/><circle cx="1160" cy="130" r="190" fill="#DCE8E0"/><circle cx="150" cy="710" r="220" fill="#F3EBD1"/><rect x="535" y="105" width="620" height="640" rx="34" fill="#fff" stroke="#2C4A38" stroke-width="8"/><rect x="605" y="72" width="480" height="76" rx="22" fill="#2C4A38"/><text x="845" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">CURRENT MEDICATION LIST</text><text x="600" y="205" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#2C4A38">Medication</text><text x="820" y="205" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#2C4A38">Dose</text><text x="970" y="205" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#2C4A38">When</text><line x1="590" y1="225" x2="1100" y2="225" stroke="#DCE8E0" stroke-width="4"/><rect x="600" y="260" width="180" height="24" rx="12" fill="#7C9E87"/><rect x="820" y="260" width="105" height="24" rx="12" fill="#C9A84C"/><rect x="970" y="260" width="110" height="24" rx="12" fill="#7C9E87"/><rect x="600" y="320" width="150" height="24" rx="12" fill="#7C9E87"/><rect x="820" y="320" width="90" height="24" rx="12" fill="#C9A84C"/><rect x="970" y="320" width="120" height="24" rx="12" fill="#7C9E87"/><rect x="585" y="390" width="530" height="115" rx="18" fill="#FAF7EC"/><text x="615" y="430" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#2C4A38">Also record</text><text x="615" y="469" font-family="Arial,sans-serif" font-size="22" fill="#5C7464">Purpose • last dose • allergies/reactions</text><rect x="585" y="535" width="530" height="135" rx="18" fill="#F2F8F4"/><text x="615" y="578" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#2C4A38">Bring the full list</text><text x="615" y="617" font-family="Arial,sans-serif" font-size="21" fill="#5C7464">Prescription + OTC + supplements</text><text x="615" y="650" font-family="Arial,sans-serif" font-size="21" fill="#5C7464">Keep original labels with the medicine</text><ellipse cx="315" cy="600" rx="165" ry="125" fill="#C89C6B"/><circle cx="310" cy="440" r="125" fill="#D9B181"/><ellipse cx="215" cy="355" rx="52" ry="105" fill="#A97649" transform="rotate(-25 215 355)"/><ellipse cx="405" cy="355" rx="52" ry="105" fill="#A97649" transform="rotate(25 405 355)"/><circle cx="270" cy="430" r="10" fill="#1A2E22"/><circle cx="350" cy="430" r="10" fill="#1A2E22"/><ellipse cx="310" cy="475" rx="20" ry="14" fill="#1A2E22"/><ellipse cx="105" cy="645" rx="105" ry="92" fill="#5B4035"/><circle cx="105" cy="545" r="85" fill="#68483B"/><path d="M42 510 L18 405 L82 470 Z" fill="#5B4035"/><path d="M168 510 L192 405 L128 470 Z" fill="#5B4035"/><circle cx="78" cy="540" r="8" fill="#fff"/><circle cx="132" cy="540" r="8" fill="#fff"/><path d="M105 565 l-13 18 h26z" fill="#1A2E22"/><rect x="110" y="730" width="310" height="54" rx="27" fill="#2C4A38"/><text x="265" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Know what they're taking.</text></svg>