name: Wallet Dependencies Temp

on:
  push:
    branches:
      - feat/digital-pet-pass-stage-one

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/digital-pet-pass-stage-one
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Apple Wallet dependency
        run: npm install --save-exact passkit-generator@3.5.7
      - name: Commit dependency files
        run: |
          if git diff --quiet package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Apple Wallet pass generator dependency"
          git push origin HEAD:feat/digital-pet-pass-stage-one
