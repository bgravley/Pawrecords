name: Patch Live Smoke Consent Choice

"on":
  push:
    branches: [fix/live-smoke-consent-choice]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-smoke-consent-choice

      - name: Patch smoke harness
        run: python3 scripts/patch_live_smoke_consent.py

      - name: Commit smoke harness update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/live_smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Teach live smoke to choose Essential only"
          git push origin HEAD:fix/live-smoke-consent-choice
