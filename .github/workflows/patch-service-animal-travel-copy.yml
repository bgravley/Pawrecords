name: Patch Service Animal Travel Copy

"on":
  push:
    branches: [fix/service-animal-travel-copy]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/service-animal-travel-copy

      - name: Apply service-animal travel copy patch
        run: python3 scripts/patch_service_animal_travel_copy.py

      - name: Commit generated source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PawRecord.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Tighten service-animal travel guidance"
          git push origin HEAD:fix/service-animal-travel-copy
