name: Patch Value First Paywall

"on":
  push:
    branches: [ux/value-first-paywall]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ux/value-first-paywall

      - name: Apply value-first paywall patch
        run: python3 scripts/patch_value_first_paywall.py

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/PawRecord.jsx src/Travel.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Move paywalls behind real product value"
          git push origin HEAD:ux/value-first-paywall
