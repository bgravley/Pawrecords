name: Sync Privacy Branch With Main

"on":
  push:
    branches: [fix/privacy-analytics-consent]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out privacy branch
        uses: actions/checkout@v4
        with:
          ref: fix/privacy-analytics-consent
          fetch-depth: 0

      - name: Merge current main and preserve combined audit gates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            test -f .git/MERGE_HEAD
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            echo "Merge conflicts: ${CONFLICTS}"
            test "${CONFLICTS}" = ".github/workflows/audit.yml"
            git checkout --ours .github/workflows/audit.yml
            git add .github/workflows/audit.yml
            git commit --no-edit
          fi
          git push origin HEAD:fix/privacy-analytics-consent
