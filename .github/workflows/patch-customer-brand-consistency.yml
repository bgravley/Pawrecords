name: Patch Customer Brand Consistency

"on":
  push:
    branches: [brand/customer-surface-consistency]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: brand/customer-surface-consistency

      - name: Apply brand consistency patch
        run: python3 scripts/patch_customer_brand_consistency.py

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/Travel.jsx src/AffiliatePortal.jsx api/send-notifications.js public/blog.html public/use-cases public/blog scripts/patch_customer_brand_consistency.py
          git diff --cached --quiet && exit 0
          git commit -m "Align customer surfaces with current brand"
          git push origin HEAD:brand/customer-surface-consistency
