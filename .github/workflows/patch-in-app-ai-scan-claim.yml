name: Patch In-App AI Scan Claim

"on":
  push:
    branches: [fix/in-app-ai-scan-claim]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/in-app-ai-scan-claim

      - name: Apply in-app AI claim patch
        run: python3 scripts/patch_in_app_ai_scan_claim.py

      - name: Commit generated source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PawRecord.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Align in-app AI scan copy with review flow"
          git push origin HEAD:fix/in-app-ai-scan-claim
