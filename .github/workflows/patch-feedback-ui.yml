name: Patch Feedback UI

"on":
  push:
    branches: [feat/feedback-feature-requests]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/feedback-feature-requests

      - name: Apply feedback UI patch
        run: python3 scripts/patch_feedback_ui.py

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PawRecord.jsx src/Admin.jsx api/admin-data.js
          git diff --cached --quiet && exit 0
          git commit -m "Expand bug reports into user feedback"
          git push origin HEAD:feat/feedback-feature-requests
