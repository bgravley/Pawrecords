name: Patch Home Logo Accessibility

"on":
  push:
    branches: [fix/accessibility-home-logo-label]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/accessibility-home-logo-label

      - name: Apply home logo accessibility fix
        run: python3 scripts/patch_home_logo_accessibility.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PawRecord.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Label home logo button for assistive technology"
          git push origin HEAD:fix/accessibility-home-logo-label
