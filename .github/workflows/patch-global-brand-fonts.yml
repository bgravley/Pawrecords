name: Patch Global Brand Fonts

"on":
  push:
    branches: [brand/customer-surface-consistency]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: brand/customer-surface-consistency

      - name: Add global brand fonts
        run: python3 scripts/patch_customer_brand_consistency.py

      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load YourPetPass brand fonts globally"
          git push origin HEAD:brand/customer-surface-consistency
