name: Patch AI Source Trust

"on":
  push:
    branches: [trust/ai-source-claims]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: trust/ai-source-claims

      - name: Apply AI source trust patch
        run: python3 scripts/patch_ai_source_trust.py

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Marketing.jsx src/Travel.jsx api/ai-travel.js
          git diff --cached --quiet && exit 0
          git commit -m "Tighten AI source hierarchy and user-facing claims"
          git push origin HEAD:trust/ai-source-claims
