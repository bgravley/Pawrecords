name: Patch Post Success Feedback

"on":
  push:
    branches: [ux/post-success-feedback]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ux/post-success-feedback

      - name: Apply post-success feedback patch
        run: python3 scripts/patch_post_success_feedback.py

      - name: Repair post-success feedback placement
        run: python3 scripts/repair_post_success_feedback.py

      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PawRecord.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Repair post-success feedback placement"
          git push origin HEAD:ux/post-success-feedback
