name: Temporary Cron Auth Patch

on:
  push:
    branches:
      - fix/cron-secret-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch cron-protected engines
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('api/send-notifications.js')
          s = p.read_text()
          if "import { verifyCronRequest } from './_cronAuth.js';" not in s:
              marker = "// Sends vaccine reminders, travel document reminders, and weekly digest\n\n"
              if marker not in s:
                  raise SystemExit('send-notifications import anchor missing')
              s = s.replace(marker, marker + "import { verifyCronRequest } from './_cronAuth.js';\n\n", 1)
          old = """export default async function handler(req, res) {
  // Verify cron secret so this can't be called publicly
  const secret = req.headers['x-cron-secret'];
  if (secret !== process.env.CRON_SECRET) {
    return res.status(401).json({ error: 'Unauthorized' });
  }

  if (!RESEND_API_KEY) {
    return res.status(500).json({ error: 'RESEND_API_KEY not configured' });
  }"""
          new = """export default async function handler(req, res) {
  res.setHeader('Cache-Control', 'private, no-store');
  if (req.method !== 'GET' && req.method !== 'POST') {
    res.setHeader('Allow', 'GET, POST');
    return res.status(405).json({ error: 'Method not allowed' });
  }

  const cron = verifyCronRequest(req, { header: 'x-cron-secret', bearer: false });
  if (!cron.ok) return res.status(cron.status).json({ error: cron.error });

  if (!RESEND_API_KEY) {
    return res.status(503).json({ error: 'RESEND_API_KEY not configured' });
  }"""
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('send-notifications auth anchor missing')
          p.write_text(s)

          p = Path('api/prewarm-cache.js')
          s = p.read_text()
          if "import { verifyCronRequest } from './_cronAuth.js';" not in s:
              marker = "import { setCorsHeaders } from './_cors.js';\n"
              if marker not in s:
                  raise SystemExit('prewarm import anchor missing')
              s = s.replace(marker, marker + "import { verifyCronRequest } from './_cronAuth.js';\n", 1)
          old = """  const isCron = req.headers['authorization'] === `Bearer ${CRON_SECRET}`;
  let isAdmin = false;

  if (!isCron) {"""
          new = """  const cron = verifyCronRequest(req);
  if (cron.status === 503) return res.status(503).json({ error: cron.error });
  const isCron = cron.ok;
  let isAdmin = false;

  if (!isCron) {"""
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('prewarm cron anchor missing')
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/send-notifications.js api/prewarm-cache.js
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "Fail closed on bulk-email and prewarm cron auth"
          git push origin HEAD:${GITHUB_REF_NAME}
