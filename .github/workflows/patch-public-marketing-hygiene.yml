name: Patch Public Marketing Hygiene

"on":
  push:
    branches: [launch/public-marketing-hygiene]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: launch/public-marketing-hygiene

      - name: Apply homepage launch cleanup
        run: python3 scripts/patch_public_marketing_hygiene.py

      - name: Commit generated homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Marketing.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove unfinished Store and align homepage claims"
          git push origin HEAD:launch/public-marketing-hygiene
