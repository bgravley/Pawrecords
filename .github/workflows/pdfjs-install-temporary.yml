name: Temporary PDF.js Install

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pdfjs-install-temporary.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  install-pdfjs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install patched PDF.js dependency
        run: npm install --save-exact pdfjs-dist@6.3.289 --ignore-scripts

      - name: Commit dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add patched bundled PDF.js"
          git push origin HEAD:${{ github.head_ref }}
