name: Password Hardening Temp

on:
  push:
    branches:
      - fix/password-minimum-eight

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/password-minimum-eight
          fetch-depth: 0
      - name: Raise signup password minimum
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Auth.jsx')
          s = p.read_text()
          old = s
          s = s.replace('if (password.length < 6) return setErr("Password must be at least 6 characters.");', 'if (password.length < 8) return setErr("Password must be at least 8 characters.");')
          s = s.replace('Password (min 6 characters)', 'Password (min 8 characters)')
          if s == old:
              print('Password minimum already hardened; no changes needed.')
          else:
              p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Auth.jsx
          git commit -m "Require 8-character signup passwords"
          git push origin HEAD:fix/password-minimum-eight
