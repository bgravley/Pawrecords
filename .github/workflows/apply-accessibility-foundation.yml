name: Apply Accessibility Foundation

"on":
  push:
    branches: [fix/accessibility-empty-states]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/accessibility-empty-states

      - name: Apply accessibility and empty-state updates
        run: python3 scripts/apply_accessibility_foundation.py

      - name: Parse changed app modules
        run: |
          node --check src/PawRecord.jsx || true
          node --check src/Travel.jsx || true

      - name: Commit generated app updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PawRecord.jsx src/Travel.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Improve keyboard access, labels, and empty states"
          git push origin HEAD:fix/accessibility-empty-states
