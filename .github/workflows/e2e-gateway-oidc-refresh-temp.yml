name: Temporary E2E Gateway OIDC Patch

on:
  push:
    branches:
      - fix/e2e-gateway-oidc-refresh

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch authenticated E2E verification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          smoke_path = Path('scripts/live_smoke.mjs')
          text = smoke_path.read_text()

          old_const = "const OIDC_TOKEN = process.env.E2E_GITHUB_OIDC_TOKEN || '';"
          new_const = """const OIDC_TOKEN = process.env.E2E_GITHUB_OIDC_TOKEN || '';
const OIDC_REQUEST_URL = process.env.ACTIONS_ID_TOKEN_REQUEST_URL || '';
const OIDC_REQUEST_TOKEN = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN || '';"""
          if old_const in text:
              text = text.replace(old_const, new_const, 1)

          old_wait = """async function waitForFileSessionCookie(context) {
  for (let i = 0; i < 30; i += 1) {
    const cookies = await context.cookies(BASE);
    if (cookies.some(cookie => cookie.name === 'ypp_file_session')) return;
    await sleep(250);
  }
  throw new Error('Private-file session cookie was not synchronized');
}"""
          new_wait = """async function waitForFileSessionCookie(context, userId) {
  const probePath = `${userId}/e2e/session-probe.txt`;
  let lastStatus = 0;
  for (let i = 0; i < 40; i += 1) {
    const response = await context.request.get(`${BASE}/api/storage-file?path=${encodeURIComponent(probePath)}`);
    lastStatus = response.status();
    // 404 proves the HttpOnly cookie authenticated successfully, ownership
    // passed, and the gateway reached private Storage. A 502 also occurs only
    // after authentication/ownership if Storage itself is transiently down.
    if ([200, 404, 502].includes(lastStatus)) return;
    if (lastStatus === 403) throw new Error('Private-file gateway authenticated the wrong user');
    if (lastStatus !== 401) throw new Error(`Private-file gateway probe returned ${lastStatus}`);
    await sleep(250);
  }
  throw new Error(`Private-file gateway did not authenticate browser session (last status ${lastStatus})`);
}"""
          if old_wait in text:
              text = text.replace(old_wait, new_wait, 1)

          bootstrap_marker = "async function bootstrap(role, reset = false, deploymentWait = false) {"
          oidc_helper = """async function currentOidcToken() {
  if (OIDC_REQUEST_URL && OIDC_REQUEST_TOKEN) {
    const separator = OIDC_REQUEST_URL.includes('?') ? '&' : '?';
    const response = await fetch(`${OIDC_REQUEST_URL}${separator}audience=yourpetpass-production-e2e`, {
      headers: { Authorization: `bearer ${OIDC_REQUEST_TOKEN}` },
    });
    if (!response.ok) throw new Error(`Could not mint fresh GitHub Actions identity (${response.status})`);
    const body = await response.json();
    if (!body?.value) throw new Error('GitHub Actions identity response did not contain a token');
    return body.value;
  }
  if (OIDC_TOKEN) return OIDC_TOKEN;
  throw new Error('E2E_GITHUB_OIDC_TOKEN is required; authenticated smoke tests may not be skipped');
}

"""
          if "async function currentOidcToken()" not in text:
              if bootstrap_marker not in text:
                  raise SystemExit('Could not find bootstrap function')
              text = text.replace(bootstrap_marker, oidc_helper + bootstrap_marker, 1)

          text = text.replace(
              "async function bootstrap(role, reset = false, deploymentWait = false) {\n  if (!OIDC_TOKEN) throw new Error('E2E_GITHUB_OIDC_TOKEN is required; authenticated smoke tests may not be skipped');",
              "async function bootstrap(role, reset = false, deploymentWait = false) {",
              1,
          )
          old_try = """  for (let i = 0; i < attempts; i += 1) {
    try {
      const response = await fetch(`${BASE}/api/e2e-login`, {"""
          new_try = """  for (let i = 0; i < attempts; i += 1) {
    try {
      const oidcToken = await currentOidcToken();
      const response = await fetch(`${BASE}/api/e2e-login`, {"""
          if old_try in text:
              text = text.replace(old_try, new_try, 1)
          text = text.replace("Authorization: `Bearer ${OIDC_TOKEN}`", "Authorization: `Bearer ${oidcToken}`", 1)

          text = text.replace("await waitForFileSessionCookie(context);", "await waitForFileSessionCookie(context, primarySession.userId);", 1)

          smoke_path.write_text(text)

          audit_path = Path('scripts/e2e_security_audit.py')
          audit = audit_path.read_text()
          anchor = "check(\"Authenticated smoke cannot silently skip\", \"E2E_GITHUB_OIDC_TOKEN is required\" in SMOKE and \"SKIP: Authenticated\" not in SMOKE)"
          extra = anchor + "\ncheck(\"OIDC identity refreshes during long runs\", \"ACTIONS_ID_TOKEN_REQUEST_URL\" in SMOKE and \"ACTIONS_ID_TOKEN_REQUEST_TOKEN\" in SMOKE and \"currentOidcToken()\" in SMOKE)\ncheck(\"Private-file auth verified through gateway\", \"Private-file gateway did not authenticate browser session\" in SMOKE and \"/api/storage-file?path=\" in SMOKE)"
          if "OIDC identity refreshes during long runs" not in audit:
              if anchor not in audit:
                  raise SystemExit('Could not find E2E audit anchor')
              audit = audit.replace(anchor, extra, 1)
          audit_path.write_text(audit)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/live_smoke.mjs scripts/e2e_security_audit.py
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "Verify file gateway and refresh E2E OIDC identity"
          git push origin HEAD:${GITHUB_REF_NAME}
