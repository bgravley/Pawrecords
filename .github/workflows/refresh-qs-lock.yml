name: Refresh qs lockfile

on:
  push:
    branches:
      - fix/qs-lockfile-sync

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/qs-lockfile-sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile with patched qs
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit exact npm lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "Sync lockfile for qs 6.16.0"
          git push origin HEAD:fix/qs-lockfile-sync
