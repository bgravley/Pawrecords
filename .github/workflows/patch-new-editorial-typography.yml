name: Patch New Editorial Typography

"on":
  push:
    branches: [fix/service-animal-travel-guidance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/service-animal-travel-guidance
      - name: Normalize new editorial typography
        run: python3 scripts/patch_new_editorial_typography.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/blog/usda-accredited-vet-appointment-pet-travel.html public/authors/travel-desk.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize new editorial body typography"
          git push origin HEAD:fix/service-animal-travel-guidance
