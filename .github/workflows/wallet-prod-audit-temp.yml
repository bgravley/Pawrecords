name: Wallet Prod Audit Temp

on:
  push:
    branches:
      - feat/digital-pet-pass-stage-one

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Production audit detail
        run: npm audit --omit=dev --json || true
