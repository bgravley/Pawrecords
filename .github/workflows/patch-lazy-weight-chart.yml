name: Patch Lazy Weight Chart

"on":
  push:
    branches: [perf/lazy-weight-chart]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: perf/lazy-weight-chart

      - name: Apply lazy weight chart patch
        run: python3 scripts/patch_lazy_weight_chart.py

      - name: Commit generated source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PawRecord.jsx src/WeightHistoryChart.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Lazy-load weight history chart"
          git push origin HEAD:perf/lazy-weight-chart
