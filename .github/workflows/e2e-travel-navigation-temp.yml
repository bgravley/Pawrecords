name: Temporary E2E Travel Navigation Patch

on:
  push:
    branches:
      - fix/e2e-travel-navigation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch travel navigation assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/live_smoke.mjs')
          text = path.read_text()

          old_trip_wait = "      await page.getByText(TRIP_NAME, { exact: true }).first().waitFor({ state: 'visible', timeout: 15000 });"
          new_trip_wait = "      await page.getByText('Quito → Miami', { exact: true }).first().waitFor({ state: 'visible', timeout: 15000 });"
          if old_trip_wait not in text:
              raise SystemExit('Could not find post-create trip-name wait')
          text = text.replace(old_trip_wait, new_trip_wait, 1)

          old_signout = "      await page.getByText('← My Pets', { exact: true }).click();\n      await page.locator('button[title=\"Sign out\"]').click();"
          new_signout = "      await page.goto(BASE, { waitUntil: 'domcontentloaded', timeout: 30000 });\n      await page.getByText(PET_NAME, { exact: true }).first().waitFor({ state: 'visible', timeout: 15000 });\n      await page.locator('button[title=\"Sign out\"]').click();"
          if old_signout not in text:
              raise SystemExit('Could not find sign-out navigation block')
          text = text.replace(old_signout, new_signout, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/live_smoke.mjs
          git commit -m "Align travel E2E with detail-page navigation"
          git push origin HEAD:${GITHUB_REF_NAME}
