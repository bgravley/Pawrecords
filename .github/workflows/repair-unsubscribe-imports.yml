name: Repair Unsubscribe Imports

"on":
  push:
    branches: [fix/unsubscribe-duplicate-imports]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/unsubscribe-duplicate-imports

      - name: Remove duplicate imports
        run: python3 scripts/dedupe_unsubscribe_imports.py

      - name: Commit repaired serverless files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/send-notifications.js api/e2e-login.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate unsubscribe imports"
          git push origin HEAD:fix/unsubscribe-duplicate-imports
