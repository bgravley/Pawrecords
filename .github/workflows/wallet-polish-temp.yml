name: Wallet Polish Temp

on:
  push:
    branches:
      - feat/digital-pet-pass-stage-one

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/digital-pet-pass-stage-one
          fetch-depth: 0
      - name: Polish Wallet authentication, privacy UI, and status docs
        run: |
          python - <<'PY'
          from pathlib import Path

          # Authenticate ownership before revealing provider setup state.
          for name in ['api/wallet/apple.js', 'api/wallet/google.js']:
              p = Path(name)
              s = p.read_text()
              owner = "    const { user, pet: owned } = await ownedPet(req, req.body?.petId);\n"
              if s.count(owner) != 1:
                  raise SystemExit(f'Unexpected ownership lookup count in {name}: {s.count(owner)}')
              s = s.replace(owner, '', 1)
              marker = "  try {\n"
              s = s.replace(marker, marker + owner, 1)
              p.write_text(s)

          # Rabies is always a valid opt-in even if the pet has none of the
          # other optional identity/contact fields.
          p = Path('src/PawRecord.jsx')
          s = p.read_text()
          start = '''          {(dog.microchip||dog.pet_type==="service_animal"||dog.emergency_contact||dog.emergency_phone)&&(\n            <div style={{background:"#EAF4EE",border:"1px solid #DCE8E0",borderRadius:12,padding:"6px 12px",marginBottom:14}}>'''
          end = '''            </div>\n          )}'''
          if start not in s:
              raise SystemExit('Wallet optional-fields wrapper start not found')
          start_repl = '''          <div style={{background:"#EAF4EE",border:"1px solid #DCE8E0",borderRadius:12,padding:"6px 12px",marginBottom:14}}>'''
          idx = s.index(start)
          tail = s[idx:]
          end_idx = tail.index(end)
          block = tail[:end_idx + len(end)]
          block = block.replace(start, start_repl, 1).replace(end, '            </div>', 1)
          s = s[:idx] + block + tail[end_idx + len(end):]
          p.write_text(s)

          # Record actual implementation status in the source-controlled plan.
          p = Path('docs/digital-pet-pass-wallet-plan.md')
          s = p.read_text()
          s = s.replace(
              'Status: Approved for implementation',
              'Status: Stage 1 foundation implemented; provider credentials and physical-device verification pending',
              1,
          )
          anchor = 'Priority: Next product feature after launch verification; before Stripe/payment work\n'
          note = '''\n## Current implementation state — August 29, 2026\n\nImplemented in code/database:\n\n- Owner-scoped Wallet settings with privacy-first opt-ins.\n- Stable per-pet Apple/Google Wallet pass records.\n- Authenticated Wallet configuration endpoint.\n- Apple `.pkpass` generation endpoint with server-only signing material.\n- Google signed save-to-Wallet JWT endpoint, gated until Generic Private Pass approval is explicitly enabled.\n- Digital Pet Pass controls inside the existing Emergency QR area.\n- Automated Wallet security/regression audit in CI.\n\nStill requires provider/account setup before the buttons become visible in production:\n\n- Apple Pass Type ID, Team ID, signing certificate/private key, and WWDR certificate.\n- Google Wallet Issuer ID, class ID, service-account signing key, publishing access, and explicit private-pass approval for this use case.\n- Physical iPhone/Android Wallet verification after those credentials are installed.\n\nThe feature is intentionally dark until at least one provider is fully configured.\n'''
          if '## Current implementation state — August 29, 2026' not in s:
              s = s.replace(anchor, anchor + note, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/wallet/apple.js api/wallet/google.js src/PawRecord.jsx docs/digital-pet-pass-wallet-plan.md
          git commit -m "Polish Wallet Stage 1 security and privacy controls"
          git push origin HEAD:feat/digital-pet-pass-stage-one
