name: Site Audit

# Runs the audit scripts three ways:
# 1. On every pull request - catches issues before they merge, not after
# 2. Every Monday morning - a safety net even when nothing is actively changing
# 3. On demand - click "Run workflow" in the Actions tab anytime
"on":
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'  # Monday 9am ET (13:00 UTC)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run full site audit
        run: python3 scripts/audit.py

      - name: Run launch security audit
        run: python3 scripts/launch_security_audit.py

      - name: Run Digital Pet Pass audit
        run: python3 scripts/wallet_audit.py

      - name: Run authenticated E2E security audit
        run: python3 scripts/e2e_security_audit.py

      - name: Run query parser regression audit
        run: python3 scripts/query_parser_audit.py

      - name: Run product analytics privacy audit
        run: python3 scripts/analytics_audit.py

      - name: Run notification relay security audit
        run: python3 scripts/notification_security_audit.py

      - name: Run checkout identity security audit
        run: python3 scripts/checkout_security_audit.py

      - name: Run emailed-record security audit
        run: python3 scripts/email_record_security_audit.py
