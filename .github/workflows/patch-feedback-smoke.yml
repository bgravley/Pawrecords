name: Patch Feedback Smoke

"on":
  push:
    branches: [feat/feedback-feature-requests]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/feedback-feature-requests

      - name: Patch production smoke
        run: python3 scripts/patch_feedback_smoke.py

      - name: Commit smoke update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/live_smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Cover feedback choices in production smoke"
          git push origin HEAD:feat/feedback-feature-requests
