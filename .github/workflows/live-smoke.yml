name: Live Production Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '30 15 * * 1'

permissions:
  contents: read
  id-token: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright for smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify notification endpoint rejects anonymous relay
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/notify-response.json -w '%{http_code}' \
            -X POST 'https://www.yourpetpass.com/api/notify-user-action' \
            -H 'Content-Type: application/json' \
            --data '{"actionType":"profile_updated","recipientEmail":"relay-probe@example.com","data":{"name":"relay-probe"}}')"
          cat /tmp/notify-response.json || true
          test "$STATUS" = "401"

      - name: Verify checkout rejects anonymous identity spoofing
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/checkout-response.json -w '%{http_code}' \
            -X POST 'https://www.yourpetpass.com/api/create-checkout' \
            -H 'Content-Type: application/json' \
            --data '{"priceId":"price_1TknmwB5s5OlwZVJsgXTq1JA","userId":"00000000-0000-0000-0000-000000000000","userEmail":"spoof@example.com","mode":"subscription"}')"
          cat /tmp/checkout-response.json || true
          test "$STATUS" = "401"

      - name: Run public and authenticated production smoke tests
        shell: bash
        env:
          E2E_BASE_URL: https://www.yourpetpass.com
        run: |
          set -euo pipefail
          TOKEN_RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=yourpetpass-production-e2e")"
          E2E_GITHUB_OIDC_TOKEN="$(jq -r '.value // empty' <<<"${TOKEN_RESPONSE}")"
          test -n "${E2E_GITHUB_OIDC_TOKEN}"
          echo "::add-mask::${E2E_GITHUB_OIDC_TOKEN}"
          export E2E_GITHUB_OIDC_TOKEN
          node scripts/live_smoke.mjs
