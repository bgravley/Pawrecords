name: Git History Secret Audit

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '15 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history without printing secret values
        run: python3 scripts/git_history_secret_audit.py
