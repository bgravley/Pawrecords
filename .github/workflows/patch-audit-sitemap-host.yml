name: Patch Audit Sitemap Host

"on":
  push:
    branches: [seo/canonical-crawler-claims]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo/canonical-crawler-claims

      - name: Align sitemap audit host
        run: python3 scripts/patch_audit_sitemap_host.py

      - name: Commit generated audit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit.py
          git diff --cached --quiet && exit 0
          git commit -m "Align sitemap audit with canonical www host"
          git push origin HEAD:seo/canonical-crawler-claims
