name: Wallet Dependency Fix Temp

on:
  push:
    branches:
      - feat/digital-pet-pass-stage-one

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/digital-pet-pass-stage-one
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install patched Wallet dependency
        run: npm install --save-exact passkit-generator@3.5.8
      - name: Update Wallet audit pin
        run: python -c "from pathlib import Path; p=Path('scripts/wallet_audit.py'); s=p.read_text().replace(\"== '3.5.7'\", \"== '3.5.8'\").replace('pinned exactly', 'pinned to patched 3.5.8 exactly'); p.write_text(s)"
      - name: Commit patched dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts/wallet_audit.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upgrade Apple Wallet dependency to patched 3.5.8"
          git push origin HEAD:feat/digital-pet-pass-stage-one
