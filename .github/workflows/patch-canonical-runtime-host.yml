name: Patch Canonical Runtime Host

"on":
  push:
    branches: [chore/canonical-runtime-host]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/canonical-runtime-host

      - name: Normalize runtime-generated YourPetPass URLs
        run: python3 scripts/patch_canonical_runtime_host.py

      - name: Commit normalized URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api src scripts/platform_audit.md
          git diff --cached --quiet && exit 0
          git commit -m "Normalize runtime URLs to canonical www host"
          git push origin HEAD:chore/canonical-runtime-host
